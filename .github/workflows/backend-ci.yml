name: Backend CI/CD

on:
  push:
    branches:
      - Main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - Main

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build Java backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build backend
        run: mvn verify

      - name: Prepare SSH
        if: github.ref == 'refs/heads/Main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy backend and check health
        timeout-minutes: 10
        if: github.ref == 'refs/heads/Main'
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" '
            set -e
            mkdir -p ~/4.Sem
            if [ ! -d ~/4.Sem/backend-repo/.git ]; then
              GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git clone git@github.com:Rovelt123/4.Sem-Sys.git ~/4.Sem/backend-repo
            fi
            cd ~/4.Sem/backend-repo
            GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git checkout Main
            GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git pull --ff-only origin Main
            cd backend
            mvn package
            mkdir -p ~/4.Sem/backend-app
            cp target/backend.jar ~/4.Sem/backend-app/backend.jar.new
            mv ~/4.Sem/backend-app/backend.jar.new ~/4.Sem/backend-app/backend.jar
            cd ~/docker-postgres
            docker compose up -d --no-deps --force-recreate sys2-api
            for attempt in $(seq 1 12); do
              echo "Checking backend health ($attempt/12)..."
              if timeout 10s docker exec sys2-api wget -T 5 -qO- http://127.0.0.1:7070/api/health; then
                echo "Backend is healthy."
                exit 0
              fi
              sleep 5
            done
            echo "Backend failed to become healthy."
            docker compose ps sys2-api
            docker compose logs --no-color --tail=100 sys2-api
            exit 1
          '

      - name: Notify Discord about test result
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_GITHUB_TEST_WEBHOOK_URL }}
          RAW_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          WORKFLOW_NAME: Backend
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_GITHUB_TEST_WEBHOOK_URL secret; skipping Discord notification."
            exit 0
          fi

          if [ "$RAW_STATUS" = "success" ]; then
            export STATUS_TEXT="lykkedes"
            export STATUS_TITLE="Tests lykkedes"
            export STATUS_COLOR="3066993"
          else
            export STATUS_TEXT="fejlede"
            export STATUS_TITLE="Tests fejlede"
            export STATUS_COLOR="15158332"
          fi

          export TESTED_AT=$(TZ=Europe/Copenhagen date +"%d-%m-%Y %H:%M")
          export RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          python3 -c "import json, os; print(json.dumps({
            'username': 'GitHub Tests',
            'embeds': [{
              'title': f\"{os.environ['WORKFLOW_NAME']} - {os.environ['STATUS_TITLE']}\",
              'description': f\"Testene **{os.environ['STATUS_TEXT']}** ved merge/push med branch `{os.environ['BRANCH_NAME']}`.\",
              'color': int(os.environ['STATUS_COLOR']),
              'fields': [
                {'name': 'Workflow', 'value': os.environ['WORKFLOW_NAME'], 'inline': True},
                {'name': 'Branch', 'value': os.environ['BRANCH_NAME'], 'inline': True},
                {'name': 'Tidspunkt', 'value': os.environ['TESTED_AT'], 'inline': True},
                {'name': 'GitHub Actions', 'value': f\"[Åbn run]({os.environ['RUN_URL']})\", 'inline': False}
              ],
              'footer': {'text': '4.Sem-Sys'}
            }]
          }))" \
            | curl --fail --silent --show-error \
                --header "Content-Type: application/json" \
                --data @- \
                "$DISCORD_WEBHOOK_URL"
